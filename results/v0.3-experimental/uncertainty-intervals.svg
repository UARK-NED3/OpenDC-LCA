<text x="480" y="242" font-size="12" text-anchor="start" fill="#222">p05 6,455.0</text>
<text x="629.4903832035832" y="270" font-size="12" text-anchor="middle" fill="#222">p50 6,601.3</text>
<text x="820" y="242" font-size="12" text-anchor="end" fill="#222">p95 6,787.8</text>
<text x="910" y="125" font-size="19" font-weight="bold" fill="#222">Blue water</text>
