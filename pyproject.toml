[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendc-lda"
version = "0.1.0"
description = "Open, physics-informed life-cycle analysis for data-center cooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenDC-LDA contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
opendc-lda = "opendc_lda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

