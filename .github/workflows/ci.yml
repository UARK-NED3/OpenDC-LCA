name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: opendc-lca validate examples/air-cooled.json
      - run: opendc-lca compare examples/*.json
      - run: opendc-lca sensitivity examples/single-phase-immersion.json
      - run: opendc-lca audit examples/single-phase-immersion.json
