name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: opendc-lca validate examples/air-cooled.json
      - run: opendc-lca compare examples/air-cooled.json examples/direct-to-chip.json examples/single-phase-immersion.json
      - run: opendc-lca sensitivity examples/single-phase-immersion.json
      - run: opendc-lca audit examples/single-phase-immersion.json
      - run: opendc-lca report examples/air-cooled.json examples/direct-to-chip.json examples/single-phase-immersion.json --output-dir /tmp/opendc-lca-report
      - run: opendc-lca performance examples/performance-map-direct-to-chip.csv
      - run: opendc-lca monte-carlo examples/direct-to-chip.json examples/uncertainty-direct-to-chip.json --samples 100
      - run: opendc-lca experimental-report examples/direct-to-chip.json examples/performance-map-direct-to-chip.csv examples/uncertainty-direct-to-chip.json --output-dir /tmp/opendc-lca-experimental
      - run: opendc-lca run examples/reliability-direct-to-chip.json --json
      - run: opendc-lca openlca-export examples/direct-to-chip.json /tmp/opendc-foreground.zip
      - run: opendc-lca openlca-inspect /tmp/opendc-foreground.zip
      - run: opendc-lca brightway-export /tmp/opendc-foreground.zip /tmp/opendc-brightway.json --database opendc-test
      - name: Smoke-test practitioner workflow
        run: |
          opendc-lca new-study /tmp/practitioner-input.json
          opendc-lca prepare-study /tmp/practitioner-input.json /tmp/practitioner-scenario.json
          opendc-lca practitioner-report /tmp/practitioner-scenario.json --output-dir /tmp/practitioner-results
          test -f /tmp/practitioner-results/PRACTITIONER_REPORT.md
      - name: Smoke-test local GUI
        run: |
          opendc-lca gui --no-browser --port 8765 &
          GUI_PID=$!
          for i in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ | grep -q "OpenDC-LCA"
          kill "$GUI_PID"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/opendc-lca-wheel
          /tmp/opendc-lca-wheel/bin/pip install dist/*.whl
          /tmp/opendc-lca-wheel/bin/opendc-lca examples --output-dir /tmp/examples
          /tmp/opendc-lca-wheel/bin/opendc-lca report /tmp/examples/air-cooled.json /tmp/examples/direct-to-chip.json /tmp/examples/single-phase-immersion.json --output-dir /tmp/report
          /tmp/opendc-lca-wheel/bin/opendc-lca experimental-report /tmp/examples/direct-to-chip.json /tmp/examples/performance-map-direct-to-chip.csv /tmp/examples/uncertainty-direct-to-chip.json --output-dir /tmp/experimental
          /tmp/opendc-lca-wheel/bin/opendc-lca run /tmp/examples/reliability-direct-to-chip.json --json
          /tmp/opendc-lca-wheel/bin/opendc-lca openlca-export /tmp/examples/direct-to-chip.json /tmp/foreground.zip
          /tmp/opendc-lca-wheel/bin/opendc-lca openlca-inspect /tmp/foreground.zip
          /tmp/opendc-lca-wheel/bin/python -c "from opendc_lca import analyze_scenario, read_openlca_jsonld, validate_scenario"
