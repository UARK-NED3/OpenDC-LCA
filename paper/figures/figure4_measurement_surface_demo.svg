<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500"
viewBox="0 0 900 500" role="img" aria-label="Synthetic measurement-map demonstration">
<style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:18px}
.title{font-size:23px;font-weight:bold}.note{font-size:14px;fill:#7A3E00}</style>
<rect width="100%" height="100%" fill="white"/>
<line x1="90" y1="390" x2="830" y2="390" stroke="#17212b"/>
<rect x="180" y="129.1" width="150" height="260.9" fill="#4B5563"/>
<text x="255" y="119.1" text-anchor="middle">486.0</text>
<text x="255" y="420" text-anchor="middle">air-cooled</text>
<rect x="490" y="137.1" width="150" height="252.9" fill="#0072B2"/>
