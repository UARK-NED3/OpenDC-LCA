<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="OpenDC-LCA evidence-to-decision workflow">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#49677f"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#17324d}
      .title{font-size:26px;font-weight:700}
      .subtitle{font-size:15px;fill:#52697c}
      .section{font-size:17px;font-weight:700}
      .cardtitle{font-size:15px;font-weight:700}
      .body{font-size:13px}
      .small{font-size:11px;fill:#587086}
      .number{font-size:25px;font-weight:700}
      .step{font-size:14px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f9fb"/>
  <text x="44" y="44" class="title">OpenDC-LCA: from heterogeneous evidence to bounded cooling decisions</text>
  <text x="44" y="68" class="subtitle">One calculation spine keeps the functional unit, boundary, transformation, uncertainty and claim status visible.</text>

  <rect x="42" y="92" width="1116" height="58" rx="10" fill="#17324d"/>
  <text x="600" y="116" text-anchor="middle" style="font-size:12px;fill:#bcd2e2;font-weight:700">DECISION QUESTION</text>
  <text x="600" y="138" text-anchor="middle" style="font-size:17px;fill:white;font-weight:700">Which cooling architecture is preferred, where can the ranking change, and what evidence would resolve it?</text>

  <text x="52" y="187" class="section">1  Evidence with declared role</text>
  <text x="414" y="187" class="section">2  Harmonization and claim gate</text>
  <text x="850" y="187" class="section">3  Decision outputs</text>

  <!-- Evidence -->
  <rect x="48" y="207" width="300" height="94" rx="10" fill="white" stroke="#7ca4bf"/>
  <rect x="48" y="207" width="9" height="94" rx="4" fill="#0072b2"/>
  <text x="73" y="235" class="cardtitle">Released lifecycle model</text>
  <text x="73" y="260" class="body">Microsoft/WSP component results</text>
  <text x="73" y="282" class="small">Role: arithmetic reconstruction</text>

  <rect x="48" y="319" width="300" height="94" rx="10" fill="white" stroke="#7ca4bf"/>
  <rect x="48" y="319" width="9" height="94" rx="4" fill="#d55e00"/>
  <text x="73" y="347" class="cardtitle">Public scenario evidence</text>
  <text x="73" y="372" class="body">eGRID · Boavizta · ÖKOBAUDAT</text>
  <text x="73" y="394" class="small">Role: bounded screening stress</text>

  <rect x="48" y="431" width="300" height="94" rx="10" fill="white" stroke="#7ca4bf"/>
  <rect x="48" y="431" width="9" height="94" rx="4" fill="#7c3aed"/>
  <text x="73" y="459" class="cardtitle">Exchange-ready inventories</text>
  <text x="73" y="484" class="body">USLCI · GLAD · openLCA/Brightway</text>
  <text x="73" y="506" class="small">Role: registered, not silently combined</text>

  <rect x="48" y="543" width="300" height="94" rx="10" fill="white" stroke="#7ca4bf"/>
  <rect x="48" y="543" width="9" height="94" rx="4" fill="#009e73"/>
  <text x="73" y="571" class="cardtitle">Primary engineering evidence</text>
  <text x="73" y="596" class="body">Performance maps · BOM · failures</text>
  <text x="73" y="618" class="small">Role: required for decision-grade claims</text>

  <!-- Spine -->
  <rect x="398" y="207" width="384" height="430" rx="14" fill="white" stroke="#9bb1c2"/>
  <line x1="441" y1="260" x2="441" y2="578" stroke="#b9c8d4" stroke-width="5"/>

  <circle cx="441" cy="263" r="17" fill="#0072b2"/>
  <text x="441" y="268" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">1</text>
  <text x="475" y="253" class="step">Define equivalence</text>
  <text x="475" y="276" class="body">Useful computation · lifetime · reliability</text>

  <circle cx="441" cy="356" r="17" fill="#d55e00"/>
  <text x="441" y="361" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">2</text>
  <text x="475" y="346" class="step">Align what can be aligned</text>
  <text x="475" y="369" class="body">Unit · GWP basis · year · geography</text>

  <circle cx="441" cy="449" r="17" fill="#7c3aed"/>
  <text x="441" y="454" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">3</text>
  <text x="475" y="439" class="step">Expose transformation limits</text>
  <text x="475" y="462" class="body">Interpolation · extrapolation · boundary gap</text>

  <circle cx="441" cy="542" r="17" fill="#009e73"/>
  <text x="441" y="547" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">4</text>
  <text x="475" y="532" class="step">Propagate and classify evidence</text>
  <text x="475" y="555" class="body">Joint stress · provenance · review status</text>

  <rect x="463" y="584" width="252" height="30" rx="15" fill="#e8edf1"/>
  <text x="589" y="604" text-anchor="middle" class="small" style="font-weight:700">SCREENING ≠ COMPARATIVE ASSERTION</text>

  <path d="M350 422 C370 422 378 422 394 422" fill="none" stroke="#49677f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M784 422 C804 422 812 422 828 422" fill="none" stroke="#49677f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <rect x="836" y="207" width="316" height="120" rx="11" fill="white" stroke="#9bb1c2"/>
  <text x="860" y="235" class="cardtitle">Reproducibility</text>
  <text x="860" y="275" class="number">24 / 24</text>
  <text x="973" y="269" class="body">released totals reconciled</text>
  <text x="973" y="291" class="small">source IDs + equations + digests</text>

  <rect x="836" y="345" width="316" height="120" rx="11" fill="white" stroke="#9bb1c2"/>
  <text x="860" y="373" class="cardtitle">Conditional decision boundary</text>
  <text x="860" y="413" class="number">96.7</text>
  <text x="944" y="407" class="body">kg CO₂e/MWh</text>
  <text x="944" y="429" class="small">cold plate / one-phase crossover</text>

  <rect x="836" y="483" width="316" height="154" rx="11" fill="white" stroke="#9bb1c2"/>
  <text x="860" y="511" class="cardtitle">Robustness and next evidence</text>
  <text x="860" y="551" class="number">29.8%</text>
  <text x="956" y="545" class="body">outside released anchors</text>
  <text x="860" y="581" class="number">99→56%</text>
  <text x="970" y="575" class="body">2P first-rank stress frequency</text>
  <text x="860" y="612" class="small">Output: crossover + stress envelope + acquisition plan</text>

  <!-- Evidence-state key -->
  <rect x="42" y="662" width="1116" height="38" rx="9" fill="#e8edf1"/>
  <circle cx="66" cy="681" r="6" fill="#0072b2"/>
  <text x="79" y="685" class="small">reconstructed</text>
  <circle cx="201" cy="681" r="6" fill="#d55e00"/>
  <text x="214" y="685" class="small">screening transformation</text>
  <circle cx="397" cy="681" r="6" fill="#7c3aed"/>
  <text x="410" y="685" class="small">registered / unlinked</text>
  <circle cx="569" cy="681" r="6" fill="#009e73"/>
  <text x="582" y="685" class="small">primary / decision-grade</text>
  <text x="1134" y="685" text-anchor="end" class="small">Every numerical claim retains its evidence class.</text>
</svg>
